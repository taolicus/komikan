<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komikan</title>
<meta name="description" content="Komikan, el juego de mesa mapuche. Próximamente.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<style>
  :root {
    --bg: #0c0b09;
    --ink: #f6efe0;
    --muted: #8d8474;
  }
  html {
    height: 100%;
    margin: 0;
    background: var(--bg);
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    box-sizing: border-box;
    min-height: 100%;
    padding: 3rem 1rem 3rem;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    /* Auto margins centre the page without clipping the top when the
       content is taller than the viewport. */
    margin: auto 0;
  }
  .mascot {
    font-size: 4.5rem;
    line-height: 1.1;
    margin-bottom: 1rem;
  }
  h1 {
    margin: 0;
    font-family: "Cinzel", Georgia, "Times New Roman", serif;
    font-size: clamp(2.75rem, 14vw, 4.5rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.1;
  }
  .soon {
    margin: 0.9rem 0 2rem;
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    text-transform: uppercase;
  }
  .board {
    width: min(78vw, 340px);
  }
  .board svg {
    width: 100%;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  }
</style>
</head>
<body>
<main>
  <div class="mascot" role="img" aria-label="Leopard">&#128006;</div>
  <h1>Komikan</h1>
  <p class="soon">Pr&oacute;ximamente</p>
  <div class="board">
<!--BOARD-->
  </div>
</main>
</body>
</html>
