<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komikan</title>
<meta name="description" content="Komikan, el juego de mesa mapuche. Próximamente.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<style>
  :root {
    --bg: #0c0b09;
    --ink: #f6efe0;
    --muted: #8d8474;
  }
  html {
    height: 100%;
    margin: 0;
    background: var(--bg);
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    box-sizing: border-box;
    min-height: 100%;
    padding: 3rem 1rem 3rem;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    /* Auto margins centre the page without clipping the top when the
       content is taller than the viewport. */
    margin: auto 0;
  }
  .mascot {
    font-size: 4.5rem;
    line-height: 1.1;
    margin-bottom: 1rem;
  }
  h1 {
    margin: 0;
    font-family: "Cinzel", Georgia, "Times New Roman", serif;
    font-size: clamp(2.75rem, 14vw, 4.5rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.1;
  }
  .soon {
    margin: 0.9rem 0 2rem;
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    text-transform: uppercase;
  }
  .board {
    width: min(78vw, 340px);
  }
  /* The board is drawn on the page background: no panel, no shadow. */
  .board svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .actions {
    margin-top: 1.8rem;
  }
  .primary {
    font-family: "Cinzel", Georgia, "Times New Roman", serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #14110c;
    background: #d8c9a6;
    border: 1px solid #d8c9a6;
    border-radius: 8px;
    padding: 0.7rem 1.7rem;
    cursor: pointer;
  }
  .primary:hover {
    background: #e8dcbe;
    border-color: #e8dcbe;
  }
  .primary[disabled] {
    opacity: 0.5;
    cursor: default;
  }
  .rooms-link {
    margin: 0.9rem 0 0;
    font-size: 0.85rem;
  }
  .rooms-link a {
    color: #8d8474;
    text-decoration: none;
    border-bottom: 1px solid #2a2620;
    padding-bottom: 1px;
  }
  .rooms-link a:hover {
    color: #f6efe0;
    border-bottom-color: #6b6252;
  }
  .note {
    margin: 0.8rem 0 0;
    min-height: 1.2em;
    color: #8d8474;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <div class="mascot" role="img" aria-label="Leopard">&#128006;</div>
  <h1>Komikan</h1>
  <p class="soon">Pr&oacute;ximamente</p>
  <div class="board">
<!--BOARD-->
  </div>
  <div class="actions">
    <button id="create" class="primary" type="button">Crear partida</button>
  </div>
  <p class="rooms-link"><a href="/rooms/">Ver las partidas</a></p>
  <p class="note" id="note"></p>
</main>
<script>
(function () {
  "use strict";

  var button = document.getElementById("create");
  var note = document.getElementById("note");

  // The browser gets its identity on this call, so the new room belongs to
  // whoever pressed the button.
  button.addEventListener("click", function () {
    button.disabled = true;
    note.textContent = "";

    fetch("/api/rooms", {
      method: "POST",
      credentials: "same-origin",
      headers: {"Content-Type": "application/json"},
      body: "{}",
    }).then(function (res) {
      if (res.status !== 201) {
        throw new Error("the room was not created");
      }
      return res.json();
    }).then(function (room) {
      location.href = "/rooms/" + room.id;
    }).catch(function () {
      button.disabled = false;
      note.textContent = "No se pudo crear la partida. Inténtalo de nuevo.";
    });
  });
})();
</script>
</body>
</html>
